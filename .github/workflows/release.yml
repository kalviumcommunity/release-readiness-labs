name: Release Pipeline

on:
  push:
    branches:
      - main
      - investigation/release-readiness
  workflow_dispatch:

jobs:
  validate-release:
    name: Validate Release & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Verify Release Approvals
        run: |
          echo "Checking release approval sign-off..."
          if grep -q "status: \"approved\"" release/approvals.yml || grep -q "status: approved" release/approvals.yml; then
            echo "Release approval sign-off verified."
          else
            echo "ERROR: Release missing required approval sign-off!"
            exit 1
          fi

      - name: Install Dependencies & Run App Tests
        run: |
          echo "Running application test suite..."
          npm install --prefix app
          npm test --prefix app
          echo "Validation complete: All quality gates passed."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-release
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Execute Production Deployment
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh v2.3.0

  rollback-on-failure:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Execute Rollback Script
        run: |
          chmod +x scripts/rollback.sh
          ./scripts/rollback.sh v2.2.0
