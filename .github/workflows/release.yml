name: Release Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Validation Tests
        run: |
          echo "Running release validation tests..."
          npm install --prefix app
          npm test --prefix app
          echo "Validation complete - application is stable and deployment configuration is verified."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-release
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          RELEASE_VERSION: "v2.3.0"
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
