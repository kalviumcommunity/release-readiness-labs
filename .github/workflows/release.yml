name: OrderFlow Release Readiness

on:
  push:
    branches:
      - main
      - investigation/release-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Request production deployment after validation and environment approval'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orderflow-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: '2.3.0'

jobs:
  validate:
    name: Validate application and release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Verify release version
        run: |
          test "$(node -p "require('./app/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./release/release.json').version")" = "$RELEASE_VERSION"
      - name: Run application tests
        working-directory: app
        run: npm test

  build:
    name: Build and publish immutable release image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/orderflow:${{ env.RELEASE_VERSION }}-${{ github.sha }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image identity
        run: echo "Built ghcr.io/${GITHUB_REPOSITORY}/orderflow:$RELEASE_VERSION-$GITHUB_SHA from commit $GITHUB_SHA"

  deploy-production:
    name: Production deployment (explicit opt-in)
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Kubernetes credentials
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64" || { echo "Missing production environment secret KUBE_CONFIG_B64"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy approved immutable image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}/orderflow:${{ env.RELEASE_VERSION }}-${{ github.sha }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
