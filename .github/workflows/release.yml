
name: Release Pipeline

on:
  push:
    branches:
      - main
      - investigation/release-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix app

      - name: Run application tests
        run: npm test --prefix app

      - name: Validate release version
        run: |
          node -e "
            const release = require('./release/release.json');
            if (release.Version !== '2.3.0') {
              throw new Error('Expected release version 2.3.0');
            }
            console.log('Validated release version:', release.Version);
          "

      - name: Validate deployment files
        run: |
          test -f deployment/kubernetes/deployment.yaml
          test -f deployment/kubernetes/service.yaml
          test -f release/approvals.yml
          test -f release/deployment-config.yml
          test -f release/rollback.yml
          echo "All required release files exist."

  deploy-production:
    name: Production Release Gate
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    timeout-minutes: 10

    steps:
      - name: Verify release readiness
        run: |
          echo "Release validation successful."
          echo "Production environment gate reached."
          echo "Release candidate: 2.3.0"
          echo "No production deployment performed."
