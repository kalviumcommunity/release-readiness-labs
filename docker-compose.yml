version: '3.8'
services:
  app:
    build: .
    image: lab-app:v2.3.0
    container_name: orderflow-app
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
