apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orderflow
    app.kubernetes.io/version: "2.3.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow
        app.kubernetes.io/version: "2.3.0"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: orderflow
          image: orderflow:2.3.0-REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: RELEASE_VERSION
              value: "2.3.0"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: API_KEY
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
