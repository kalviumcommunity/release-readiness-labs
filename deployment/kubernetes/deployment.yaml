apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orderflow-app
  template:
    metadata:
      labels:
        app: orderflow-app
        version: v2.3.0
    spec:
      containers:
      - name: orderflow-app
        image: orderflow-app:v2.3.0
        ports:
        - containerPort: 3000
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_PASSWORD