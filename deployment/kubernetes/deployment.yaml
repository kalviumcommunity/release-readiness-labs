
apiVersion: apps/v1
kind: Deployment

metadata:
  name: lab-app
  namespace: production
  labels:
    app: lab-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: lab-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: lab-app

    spec:
      containers:
        - name: lab-app
          image: lab-app:2.3.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderflow-production-secrets
                  key: API_KEY

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-production-secrets
                  key: DATABASE_PASSWORD

            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: orderflow-production-secrets
                  key: TOKEN

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
