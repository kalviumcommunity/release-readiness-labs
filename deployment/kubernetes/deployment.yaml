apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow
  labels:
    app: orderflow
    version: v2.3.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orderflow
  template:
    metadata:
      labels:
        app: orderflow
        version: v2.3.0
    spec:
      containers:
      - name: orderflow
        image: orderflow:v2.3.0
        ports:
        - containerPort: 3000
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: API_KEY
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orderflow-secrets
              key: DATABASE_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
