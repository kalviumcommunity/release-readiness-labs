environment: production
version: v2.3.0
image_tag: v2.3.0
# Secret VALUES are never stored in the repo. They are injected at deploy time
# from GitHub Actions Secrets (CI) / Kubernetes Secret "orderflow-secrets" (runtime).
secrets:
  API_KEY: ${{ secrets.API_KEY }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  TOKEN: ${{ secrets.TOKEN }}
  AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
protection:
  github_environment: production
  required_reviewers: true
  allowed_branches: [main]
infrastructure:
  platform: managed-kubernetes
  registry: ecr-immutable-tags
