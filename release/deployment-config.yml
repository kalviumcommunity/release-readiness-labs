
environment: production

release:
  version: "2.3.0"
  image_tag: "2.3.0"

deployment:
  provider: kubernetes
  namespace: production
  manifest: deployment/kubernetes/deployment.yaml
  replicas: 3

secrets:
  kubernetes_secret_name: orderflow-production-secrets
  required_keys:
    - API_KEY
    - DATABASE_PASSWORD
    - TOKEN
